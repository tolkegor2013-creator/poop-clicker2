<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poop Clicker 💩</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #24130b, #4a2714);
  color: white;
  min-height: 100vh;
  overflow-x: hidden;
}

.header {
  text-align: center;
  padding: 18px 10px;
  font-size: 28px;
  font-weight: bold;
}

.score {
  text-align: center;
  font-size: 24px;
  margin-bottom: 15px;
}

.game {
  display: flex;
  min-height: calc(100vh - 100px);
}

.left {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.poop {
  font-size: 180px;
  cursor: pointer;
  user-select: none;
  transition: transform 0.08s;
  filter: drop-shadow(0 15px 10px rgba(0,0,0,0.4));
}

.poop:active {
  transform: scale(0.88);
}

.hint {
  margin-top: 15px;
  font-size: 18px;
  opacity: 0.8;
}

.shop {
  width: 310px;
  background: rgba(0,0,0,0.35);
  border-left: 2px solid rgba(255,255,255,0.15);
  padding: 18px;
  overflow-y: auto;
}

.shop h2 {
  margin-top: 0;
  text-align: center;
}

.upgrade {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}

.upgrade-title {
  font-size: 19px;
  font-weight: bold;
}

.upgrade-info {
  margin: 6px 0 10px;
  font-size: 14px;
  opacity: 0.8;
}

button {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 12px;
  background: #8b5a2b;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #555;
  opacity: 0.6;
}

button:not(:disabled):active {
  transform: scale(0.97);
}

@media (max-width: 700px) {
  .game {
    flex-direction: column;
  }

  .left {
    min-height: 55vh;
  }

  .shop {
    width: 100%;
    border-left: none;
    border-top: 2px solid rgba(255,255,255,0.15);
  }

  .poop {
    font-size: 140px;
  }
}

.pop {
  position: fixed;
  pointer-events: none;
  font-weight: bold;
  font-size: 25px;
  animation: pop 0.8s forwards;
}

@keyframes pop {
  0% {
    transform: translateY(0);
    opacity: 1;
  }

  100% {
    transform: translateY(-80px);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="header">
  💩 POOP CLICKER 💩
</div>

<div class="score">
  💩 Какашек: <span id="score">0</span>
</div>

<div class="game">

  <div class="left">

    <div class="poop" id="poop">💩</div>

    <div class="hint">
      Нажимай на какашку!
    </div>

    <div style="margin-top:15px;">
      За клик: <span id="power">1</span> 💩
    </div>

  </div>

  <div class="shop">

    <h2>🛒 Магазин</h2>

    <div class="upgrade">
      <div class="upgrade-title">💪 Сильный клик</div>

      <div class="upgrade-info">
        +1 какашка за клик
        <br>
        Уровень: <span id="powerLevel">0</span>
      </div>

      <button id="powerButton">
        Купить за 25 💩
      </button>
    </div>

    <div class="upgrade">
      <div class="upgrade-title">🤖 Автокликер</div>

      <div class="upgrade-info">
        +1 какашка каждую секунду
        <br>
        Уровень: <span id="autoLevel">0</span>
      </div>

      <button id="autoButton">
        Купить за 100 💩
      </button>
    </div>

    <div class="upgrade">
      <div class="upgrade-title">🚀 Мега клик</div>

      <div class="upgrade-info">
        +10 какашек за клик
        <br>
        Уровень: <span id="megaLevel">0</span>
      </div>

      <button id="megaButton">
        Купить за 500 💩
      </button>
    </div>

    <button onclick="resetGame()" style="margin-top:15px;background:#7b2525;">
      🗑️ Сбросить игру
    </button>

  </div>

</div>

<script>

let score = Number(localStorage.getItem("poopScore")) || 0;
let power = Number(localStorage.getItem("poopPower")) || 1;

let powerLevel =
  Number(localStorage.getItem("powerLevel")) || 0;

let autoLevel =
  Number(localStorage.getItem("autoLevel")) || 0;

let megaLevel =
  Number(localStorage.getItem("megaLevel")) || 0;

const scoreElement = document.getElementById("score");
const powerElement = document.getElementById("power");

const powerLevelElement =
  document.getElementById("powerLevel");

const autoLevelElement =
  document.getElementById("autoLevel");

const megaLevelElement =
  document.getElementById("megaLevel");

const powerButton =
  document.getElementById("powerButton");

const autoButton =
  document.getElementById("autoButton");

const megaButton =
  document.getElementById("megaButton");

const poop =
  document.getElementById("poop");


function saveGame() {

  localStorage.setItem("poopScore", score);
  localStorage.setItem("poopPower", power);

  localStorage.setItem("powerLevel", powerLevel);
  localStorage.setItem("autoLevel", autoLevel);
  localStorage.setItem("megaLevel", megaLevel);
}


function update() {

  scoreElement.textContent = Math.floor(score);
  powerElement.textContent = power;

  powerLevelElement.textContent = powerLevel;
  autoLevelElement.textContent = autoLevel;
  megaLevelElement.textContent = megaLevel;

  let powerCost = 25 * Math.pow(2, powerLevel);
  let autoCost = 100 * Math.pow(2, autoLevel);
  let megaCost = 500 * Math.pow(2, megaLevel);

  powerButton.textContent =
    "Купить за " + powerCost + " 💩";

  autoButton.textContent =
    "Купить за " + autoCost + " 💩";

  megaButton.textContent =
    "Купить за " + megaCost + " 💩";

  powerButton.disabled = score < powerCost;
  autoButton.disabled = score < autoCost;
  megaButton.disabled = score < megaCost;
}


function meow() {

  const audioContext =
    new (window.AudioContext ||
    window.webkitAudioContext)();

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type = "sine";

  oscillator.frequency.setValueAtTime(
    600,
    audioContext.currentTime
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    900,
    audioContext.currentTime + 0.12
  );

  gain.gain.setValueAtTime(
    0.15,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.01,
    audioContext.currentTime + 0.25
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + 0.25
  );
}


function popup(event, amount) {

  const element =
    document.createElement("div");

  element.className = "pop";

  element.textContent =
    "+" + amount + " 💩";

  element.style.left =
    event.clientX + "px";

  element.style.top =
    event.clientY + "px";

  document.body.appendChild(element);

  setTimeout(() => {
    element.remove();
  }, 800);
}


poop.addEventListener("click", function(event) {

  let amount = power;

  if (megaLevel > 0) {
    amount += megaLevel * 10;
  }

  score += amount;

  meow();

  popup(event, amount);

  saveGame();

  update();

});


powerButton.addEventListener("click", function() {

  let cost =
    25 * Math.pow(2, powerLevel);

  if (score >= cost) {

    score -= cost;

    power++;
    powerLevel++;

    saveGame();
    update();
  }

});


autoButton.addEventListener("click", function() {

  let cost =
    100 * Math.pow(2, autoLevel);

  if (score >= cost) {

    score -= cost;

    autoLevel++;

    saveGame();
    update();
  }

});


megaButton.addEventListener("click", function() {

  let cost =
    500 * Math.pow(2, megaLevel);

  if (score >= cost) {

    score -= cost;

    megaLevel++;

    saveGame();
    update();
  }

});


setInterval(function() {

  if (autoLevel > 0) {

    score += autoLevel;

    saveGame();
    update();

  }

}, 1000);


function resetGame() {

  if (confirm("Точно сбросить весь прогресс?")) {

    score = 0;
    power = 1;

    powerLevel = 0;
    autoLevel = 0;
    megaLevel = 0;

    saveGame();
    update();
  }

}


update();

</script>

</body>
</html>
